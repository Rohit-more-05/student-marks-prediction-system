name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours to prevent sleeping
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          curl -s --head --request GET "https://rohit-student-marks.streamlit.app/" || echo "Ping failed or URL not reachable yet"
